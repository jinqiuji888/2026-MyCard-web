<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 명함 만들기</title>

    <!-- 구글 폰트 연결 (Black Han Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
    
    <!--CSS 연결-->
    <link href="css/style.css" rel="stylesheet">
  </head>
  <body>
    <!--머리말(제목)-->
      <header class="site-header">
        <h1>나만의 명함 만들기</h1>
        <p>왼쪽에 입력하면 오른쪽에 명함이 바로 반영됩니다.</p>
    </header>

    <!--메인-->
      <main class="container">
        <!--왼쪽 입력 양식-->
        <section class="editor">
          <form action="#">
            <!--기본 정보 몪음-->
            <fieldset>
              <legend>기본 정보</legend>
              <label for="input-name">이름</label>
              <input type="text" id="input-name" placeholder="예:홍기동">

              <label for="input-dept">학과</label>
              <select id="input-dept">
                <option>컴퓨터공학과</option>
                <option>스프트웨어공학과</option>
                <option>인공지능학과</option>
                <option>게임콘텐츠학과</option>
                <option>정보보안학과</option>
              </select>

              <label for="input-role">희망 분야</label>
              <input type="text" id="input-role" placeholder="예:프론트엔드 개발자">
            </fieldset>

            <!--연락처 몪음-->
            <fieldset>
              <legend>연락처</legend>
              <label for="input-phone">전화번호</label>
              <input type="tel" id="input-type" placeholder="에:010-1234-1234">

              <label for="input-email">이메일</label>
              <input type="email" id="input-email" placeholder="예:hong@silla.ac.kr">
            </fieldset>

            <!--소개 몪음-->
            <fieldset>
              <legend>한 줄 소개</legend>
              <label for="input-intro">나를 소개하는 문장</label>
              <textarea id="input-intro" rows="3" placeholder="예:항상 최선을 다하는 사람."></textarea>
            </fieldset>
          </form>
        </section>
        <!--오른쪽 명함 미리보기-->
        <sextion class="preview">
          <h2>미리보기</h2>

          <!--카드 영역-->
          <div class="card">
            <div class="card-top">
              <p class="card-dept">컴퓨터공학과</p>
              <p class="card-name">홍기동</p>
              <p class="card-role">프론트엔드 개발자</p>
            </div>

            <p class="card-intro">항상 최선을 다하는 사람</p>

            <ul class="card-contact">
              <li>☎️<span class="card-phone">010-1234-1234</span></li>
              <li>📤<span class="card-email">hong@silla.ac.kr</span></li>
            </ul>
          </div>
        </sextion>
      </main>

    <!--꼬리말-->
      <footer class="site-footer">
        <small>&copy;2026 웹 기초프로그래밍 - 호일흔</small>
      </footer>

      <script src="js/script.js"></script>
  </body>
</html>
